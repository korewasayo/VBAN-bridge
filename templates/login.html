<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBAN Bridge - Access</title>
    <link rel="stylesheet" href="/static/css/style.css?v=12">
</head>
<body>
    <div class="login-wrapper">
        <div class="card login-card">
            <div class="text-center mb-2">
                <h1 style="font-size: 3rem; margin-bottom: 10px;">🎵</h1>
                <h2>VBAN Bridge</h2>
                <p style="color: var(--text-secondary);">Enter your access token to request music</p>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="token">Access Token</label>
                    <input type="text" id="token" name="token" class="form-control" placeholder="e.g. ABC-123" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enter</button>
            </form>

            <div class="text-center mt-2">
                <a href="/admin/login" style="font-size: 0.9rem;">Admin? Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
