<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBAN Hub - Secure Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #0f0f0f; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background-color: #1e1e1e; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        h2 { color: #4CAF50; margin-bottom: 20px; }
        input[type="text"] { 
            width: 90%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #111; 
            color: white; 
            font-size: 16px; 
            text-align: center;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2196F3; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { background-color: #1976D2; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Access Request</h2>
        <p style="color: #bbb; font-size: 0.9em; margin-bottom: 30px;">Enter your one-time password to access the music dashboard.</p>
        <form action="/login" method="POST">
            <input type="text" name="otp" placeholder="Enter OTP" required autocomplete="off">
            <button type="submit">Unlock Access</button>
        </form>
    </div>
</body>
</html>
