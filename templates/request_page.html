<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBAN Bridge 🎵 Music Requests</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card-header" style="border:none;">
            <h2>VBAN Bridge 🎵 Music Requests</h2>
            <div>
                {% if user %}
                    <span style="margin-right: 15px; color: var(--text-secondary);">Logged in as {{ user.username }}</span>
                    <a href="/logout" class="btn btn-secondary btn-sm">Logout</a>
                {% else %}
                    <a href="/login" class="btn btn-primary btn-sm">Login</a>
                {% endif %}
            </div>
        </div>

        <div class="card">
            <h3>Request a Song</h3>
            <div class="tabs-nav mt-2">
                <button class="tab-btn active" onclick="switchTab('text')">Text Request</button>
                <button class="tab-btn" onclick="switchTab('upload')">Upload MP3</button>
            </div>

            <!-- Text Request Form -->
            <div id="tab-text" class="tab-pane active">
                <form id="text-request-form" onsubmit="submitTextRequest(event)">
                    <div class="form-group">
                        <label for="title">Song Title, Search Query, or Link</label>
                        <input type="text" id="title" class="form-control" placeholder="e.g. Darude Sandstorm, or YouTube/Spotify URL" required>
                    </div>
                    <div class="form-group">
                        <label for="artist">Artist (Optional)</label>
                        <input type="text" id="artist" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                </form>
            </div>

            <!-- Upload Request Form -->
            <div id="tab-upload" class="tab-pane">
                <form id="upload-request-form" onsubmit="submitUploadRequest(event)">
                    <div class="form-group">
                        <label for="up_title">Song Title</label>
                        <input type="text" id="up_title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="up_artist">Artist (Optional)</label>
                        <input type="text" id="up_artist" class="form-control">
                    </div>
                    
                    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file_input').click()">
                        <h1 style="font-size: 2rem;">📁</h1>
                        <p>Drag & Drop an MP3 file here or click to browse</p>
                        <p style="font-size: 0.8rem; color: var(--text-secondary);">(Max 50MB)</p>
                        <input type="file" id="file_input" accept="audio/mpeg,audio/mp3,.mp3" onchange="handleFileSelect(event)">
                        <div id="file-name-display" style="margin-top: 10px; font-weight: bold; color: var(--accent-green);"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="upload-btn" disabled>Upload & Request</button>
                </form>
            </div>
        </div>

        <div class="card">
            <h3>Current Queue</h3>
            <div class="queue-list mt-2" id="queue-list">
                <p style="color: var(--text-secondary);">Loading queue...</p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // Toast Notifications
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `✅ ${message}` : `❌ ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 5000);
        }

        // Text Request Submission
        async function submitTextRequest(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const artist = document.getElementById('artist').value;
            const btn = e.target.querySelector('button');
            
            try {
                btn.disabled = true;
                btn.innerText = 'Submitting...';
                
                const formData = new FormData();
                formData.append('title', title);
                formData.append('artist', artist);
                formData.append('type', 'text');

                const response = await fetch('/api/requests/submit', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showToast('Request submitted successfully!');
                    document.getElementById('text-request-form').reset();
                    fetchQueue();
                } else {
                    const data = await response.json();
                    showToast(data.detail || 'Failed to submit request', 'error');
                }
            } catch (err) {
                showToast('Network error occurred', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit Request';
            }
        }

        // File Upload Logic
        let selectedFile = null;
        const dropZone = document.getElementById('drop-zone');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                document.getElementById('file_input').files = e.dataTransfer.files;
                handleFileSelect({target: document.getElementById('file_input')});
            }
        });

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                if (selectedFile.size > 50 * 1024 * 1024) {
                    showToast('File is larger than 50MB limit', 'error');
                    e.target.value = '';
                    selectedFile = null;
                    document.getElementById('upload-btn').disabled = true;
                    document.getElementById('file-name-display').innerText = '';
                    return;
                }
                document.getElementById('file-name-display').innerText = `Selected: ${selectedFile.name}`;
                document.getElementById('upload-btn').disabled = false;
                
                // Auto-fill title if empty
                if (!document.getElementById('up_title').value) {
                    document.getElementById('up_title').value = selectedFile.name.replace(/\.[^/.]+$/, "");
                }
            }
        }

        async function submitUploadRequest(e) {
            e.preventDefault();
            if (!selectedFile) return;

            const title = document.getElementById('up_title').value;
            const artist = document.getElementById('up_artist').value;
            const btn = document.getElementById('upload-btn');
            
            try {
                btn.disabled = true;
                btn.innerText = 'Uploading...';
                
                const formData = new FormData();
                formData.append('title', title);
                formData.append('artist', artist);
                formData.append('file', selectedFile);
                formData.append('type', 'upload');

                const response = await fetch('/api/requests/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showToast('File uploaded and requested successfully!');
                    document.getElementById('upload-request-form').reset();
                    document.getElementById('file-name-display').innerText = '';
                    selectedFile = null;
                    fetchQueue();
                } else {
                    const data = await response.json();
                    showToast(data.detail || 'Failed to upload file', 'error');
                }
            } catch (err) {
                showToast('Network error occurred during upload', 'error');
            } finally {
                btn.innerText = 'Upload & Request';
                btn.disabled = selectedFile == null;
            }
        }

        // Queue Fetching
        function getBadgeClass(status) {
            switch(status.toLowerCase()) {
                case 'pending': return 'badge-pending';
                case 'approved': return 'badge-approved';
                case 'playing': return 'badge-playing';
                case 'played': return 'badge-played';
                case 'rejected': return 'badge-rejected';
                default: return 'badge-played';
            }
        }

        async function fetchQueue() {
            try {
                const response = await fetch('/api/requests/queue');
                if (response.ok) {
                    const queue = await response.json();
                    const queueList = document.getElementById('queue-list');
                    
                    if (!queue || queue.length === 0) {
                        queueList.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">The queue is currently empty.</p>';
                        return;
                    }
                    
                    let html = '';
                    queue.forEach((item, index) => {
                        html += `
                        <div class="queue-item">
                            <div class="queue-number">${index + 1}</div>
                            <div class="queue-details">
                                <div class="queue-title">${item.title || 'Unknown Title'}</div>
                                <div class="queue-artist">${item.artist || 'Unknown Artist'}</div>
                            </div>
                            <div class="queue-meta">
                                <span class="badge ${getBadgeClass(item.status)}">${item.status}</span>
                            </div>
                        </div>`;
                    });
                    
                    queueList.innerHTML = html;
                }
            } catch (err) {
                console.error("Failed to fetch queue", err);
            }
        }

        // Initial fetch and auto-refresh
        fetchQueue();
        setInterval(fetchQueue, 5000);
    </script>
</body>
</html>
